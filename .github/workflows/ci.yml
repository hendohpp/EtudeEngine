name: CI

# triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# cancel previous running jobs in favour of running on newest code
concurrency:
  # limit rule for this config on this branch
  group: ${{ github.workflow }}-${{ github.ref }} 
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Package and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -e ".[dev]"

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Test Suite (Pytest)
        run: |
          pytest

      - name: Build Wheel & Source Distribution
        run: |
          pip install build
          python -m build